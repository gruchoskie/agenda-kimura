<style>
/* Layout: app de celular em coluna única. Cabeçalho com seletor de atleta, abas embaixo, cartões de jogo com horário grande à esquerda (como placar de ginásio). */
:root{
  --bg:#f1f3f6; --surface:#ffffff; --ink:#0f1b2d; --muted:#5d6b80; --line:#dde2ea;
  --accent:#e8590c; --accent-ink:#ffffff; --accent-soft:#fdeadd;
  --ok:#17803d; --ok-soft:#dff3e5; --warn:#a15c00; --warn-soft:#fbefd2;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1320; --surface:#152033; --ink:#eef2f8; --muted:#97a6bd; --line:#26344c;
  --accent:#ff8a4c; --accent-ink:#1a0d03; --accent-soft:#3a2314;
  --ok:#5fd18a; --ok-soft:#14301f; --warn:#f2c35c; --warn-soft:#352a10; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1320; --surface:#152033; --ink:#eef2f8; --muted:#97a6bd; --line:#26344c;
  --accent:#ff8a4c; --accent-ink:#1a0d03; --accent-soft:#3a2314;
  --ok:#5fd18a; --ok-soft:#14301f; --warn:#f2c35c; --warn-soft:#352a10; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
.wrap{max-width:640px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header{padding-top:18px}
.brand{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font:700 28px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;margin:0}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px;color:var(--muted);text-decoration:none;display:inline-flex;align-items:center;min-height:38px;white-space:nowrap}
.top-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.live{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.who{margin-top:16px}
.label{font:600 12px/1 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none;margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)))}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;font-weight:500;font-size:15px;min-height:44px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip small{opacity:.7;margin-left:4px}
main{margin-top:16px;display:flex;flex-direction:column;gap:12px}
.day{font:700 20px/1 var(--display);text-transform:uppercase;letter-spacing:.04em;padding-top:8px;display:flex;align-items:center;gap:10px}
.day::after{content:"";flex:1;height:1px;background:var(--line)}
.next{background:var(--ink);color:var(--bg);border-radius:14px;padding:16px;display:grid;gap:10px}
.next .label{color:var(--accent)}
.next .big{font:700 56px/1 var(--display);font-variant-numeric:tabular-nums}
.next .where{font:700 30px/1.05 var(--display);text-transform:uppercase}
.next .vs{font-size:17px;overflow-wrap:anywhere}
.next .meta{opacity:.75;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:grid;grid-template-columns:76px minmax(0,1fr);overflow:hidden}
.card.done{opacity:.6}
.time{border-right:1px solid var(--line);padding:12px 6px;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:2px}
.time b{font:700 30px/1 var(--display);font-variant-numeric:tabular-nums}
.time span{font-size:12px;color:var(--muted)}
.body{padding:12px 14px;min-width:0;display:grid;gap:6px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border-radius:6px;padding:3px 7px;background:var(--bg);color:var(--muted)}
.tag.court{background:var(--accent-soft);color:var(--accent)}
.side{overflow-wrap:anywhere}
.side.me{font-weight:600}
.side.me::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:8px}
.side.tbd{color:var(--muted);font-style:italic}
.x{color:var(--muted);font-size:13px;padding-left:16px}
.mem{font-size:14px;color:var(--accent);font-weight:600}
.gap{margin:0;font-size:14px;color:var(--muted);text-align:center;padding:2px 0}
.gap b{color:var(--warn);font-weight:600}
.gap.tight b{color:var(--accent)}
.finish{justify-self:start;border:1px solid var(--line);background:none;border-radius:8px;padding:7px 12px;font-size:14px;color:var(--muted);min-height:36px}
.card.done .finish{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.finish.on-dark{border-color:rgba(255,255,255,.35);color:var(--bg)}
.tools{display:grid;gap:8px}
input[type=search],textarea{width:100%;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:11px 14px;font:inherit}
textarea{min-height:130px;font-size:14px}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.ath{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;width:100%;text-align:left}
.ath strong{font-weight:600}
.ath .n{font:700 24px/1 var(--display);font-variant-numeric:tabular-nums;color:var(--accent)}
.ath small{color:var(--muted);display:block}
.note{font-size:13px;color:var(--muted);text-align:center;padding:8px 0}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:5}
nav .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.count{font:700 20px/1.1 var(--display);color:var(--accent);text-transform:uppercase;letter-spacing:.03em}
.group{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.gh{display:flex;align-items:baseline;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--bg)}
.gh b{font:700 26px/1 var(--display);font-variant-numeric:tabular-nums}
.gh span{font-size:13px;color:var(--muted)}
.slot{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;padding:10px 14px;align-items:start}
.slot+.slot{border-top:1px solid var(--line)}
.slot.done{opacity:.55}
.slot b{font:700 18px/1.2 var(--display);text-transform:uppercase;color:var(--accent)}
.slot span{overflow-wrap:anywhere}
.slot small{display:block;color:var(--muted);font-size:12px}
nav button{border:0;background:none;border-radius:10px;padding:10px 2px;font-weight:600;font-size:13px;color:var(--muted);min-height:48px}
nav button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.sheet{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.sheet p{margin:0;font-size:14px;color:var(--muted)}
.sheet code{background:var(--bg);padding:1px 5px;border-radius:4px;font-size:13px}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px 16px;font-weight:600;min-height:46px}
.msg{font-size:14px;color:var(--ok)}
.msg.err{color:var(--warn)}
@media (prefers-reduced-motion:no-preference){.chip,nav button{transition:background .15s}}
</style>

  var h='<div class="tools"><input type="search" id="q" placeholder="Buscar atleta, categoria ou fase" value="'+esc(state.q)+'" aria-label="Buscar">'+
  '<div class="chips" style="margin-right:0"><button class="chip" type="button" data-day="" aria-pressed="'+(state.day==="")+'">Os dois dias</button>'+
  Object.keys(DAYS).map(function(k){return '<button class="chip" type="button" data-day="'+k+'" aria-pressed="'+(state.day===k)+'">'+esc(DAYS[k])+'</button>'}).join("")+
  '</div></div>';
  var q=norm(state.q);
  var list=sorted(mineAll()).filter(function(m){
    if(state.day&&m.d!==state.day)return false;
    return !q||norm([m.a,m.b,m.cat,m.r,m.c].join(" ")).indexOf(q)>-1;
  });
  h+= list.length? '<div style="display:grid;gap:12px">'+list.map(cardHtml).join("")+'</div>' : '<div class="empty">Nada encontrado para essa busca.</div>';
  return h;
}

function viewTime(){
  var h='<div class="chips" style="margin-right:0"><button class="chip" type="button" data-day="" aria-pressed="'+(state.day==="")+'">Os dois dias</button>'+
  Object.keys(DAYS).map(function(k){return '<button class="chip" type="button" data-day="'+k+'" aria-pressed="'+(state.day===k)+'">'+esc(DAYS[k])+'</button>'}).join("")+'</div>';
  var list=sorted(mineAll()).filter(function(m){return !state.day||m.d===state.day}), last="";
  list.forEach(function(m){
    var k=m.d+" "+m.t;
    if(k!==last){h+=(last?'</div>':'')+'<div class="group"><div class="gh"><b>'+esc(m.t)+'</b><span>'+esc(DAYS[m.d]||m.d)+'</span></div>';last=k}
    h+=lineHtml(m);
  });
  return h+(last?'</div>':'')+'<p class="note">Todos os jogos do clube, agrupados por horário. Útil para técnicos e pais.</p>';
}

function viewClub(){
  return data.athletes.map(function(n){
    var l=sorted(mineFor(n)), first=l[0];
    return '<button class="ath" type="button" data-pick="'+esc(n)+'"><span><strong>'+esc(n)+'</strong><small>'+(first?'Primeiro jogo: '+esc((DAYS[first.d]||first.d).split(",")[0])+' às '+esc(first.t)+' · '+esc(first.c):'Sem jogos na lista')+'</small></span><span class="n">'+l.length+'</span></button>';
  }).join("");
}

function viewImport(){
  return '<div class="sheet"><div class="label">Carregar listas</div>'+
  '<p>Use só se quiser montar outra agenda. A programação oficial já vem carregada.</p>'+
  '<textarea id="impA" placeholder="Ana Beatriz Souza&#10;Carlos Eduardo Lima" aria-label="Lista de atletas"></textarea>'+
  '<p>Jogos, um por linha, campos separados por <code>;</code> na ordem: horário; mesa; categoria; fase; atleta A x atleta B</p>'+
  '<textarea id="impM" placeholder="08:30; Mesa 1; Sub-15 Feminino; Oitavas; Ana Souza x Larissa Prado" aria-label="Lista de jogos"></textarea>'+
  '<div class="row"><button class="primary" type="button" id="doImport">Montar agenda</button>'+(isImported?'<button class="ghost" type="button" id="doReset">Voltar à programação oficial</button>':'')+'</div>'+
  '<div class="msg" id="impMsg" role="status"></div></div>';
}

function parse(){
  var A=document.getElementById("impA").value.split(/\n/).map(function(s){return s.trim()}).filter(Boolean);
  var M=[];
  document.getElementById("impM").value.split(/\n/).forEach(function(line){
    line=line.trim(); if(!line)return;
    var p=line.split(/\s*[;|\t]\s*/);
    var vs=(p[p.length-1]||"").split(/\s+x\s+|\s+vs\.?\s+/i);
    if(p.length<5||vs.length<2||!/^\d{1,2}[:h]\d{2}$/.test(p[0]))return;
    M.push({t:p[0].replace("h",":").replace(/^(\d):/,"0$1:"),c:p[1],cat:p[2],r:p[3],a:vs[0].trim(),b:vs[1].trim()});
  });
  return {A:A,M:M};
}

function render(){
  document.getElementById("title").textContent=data.event;
  document.getElementById("sub").textContent=data.sub;
  renderWho();
  document.querySelectorAll("nav button").forEach(function(b){b.setAttribute("aria-selected",String(!state.open&&b.dataset.tab===state.tab))});
  document.querySelector(".who").hidden=state.open||state.tab!=="mine";
  document.getElementById("main").innerHTML= state.open?viewImport(): state.tab==="mine"?viewMine(): state.tab==="time"?viewTime(): state.tab==="all"?viewAll():viewClub();
}
setInterval(function(){if(!state.open&&state.tab==="mine")render()},60000);

document.addEventListener("click",function(e){
  var t=e.target.closest("button"); if(!t)return;
  if(t.dataset.tab){state.tab=t.dataset.tab;state.open=false;render();window.scrollTo(0,0)}
  else if(t.dataset.me!==undefined){state.me=t.dataset.me;render()}
  else if(t.dataset.done!==undefined){var id=t.dataset.done;if(done[id])delete done[id];else done[id]=1;save(DONEKEY,done);render()}
  else if(t.dataset.day!==undefined){state.day=t.dataset.day;render()}
  else if(t.dataset.pick){state.me=t.dataset.pick;state.tab="mine";render();window.scrollTo(0,0)}
  else if(t.id==="btnImport"){state.open=!state.open;render()}
  else if(t.id==="doReset"){try{localStorage.removeItem(KEY)}catch(x){}location.reload()}
  else if(t.id==="doImport"){
    var r=parse(), msg=document.getElementById("impMsg");
    if(!r.A.length||!r.M.length){msg.className="msg err";msg.textContent="Preencha as duas listas. Cada linha de jogo precisa ter 5 campos e o horário no formato 08:30.";return}
    save(KEY,{athletes:r.A,matches:r.M});
    location.reload();
  }
});
document.addEventListener("input",function(e){
  if(e.target.id==="q"){state.q=e.target.value;var pos=e.target.selectionStart;render();var q=document.getElementById("q");q.focus();q.setSelectionRange(pos,pos)}
});
render();
})();
</script>

</body></html>
